services:
  postgres:
    image: postgres:16
    container_name: kcp_postgres
    environment:
      POSTGRES_USER: kcp
      POSTGRES_PASSWORD: kcp
      POSTGRES_DB: kcp
    ports:
      - "5433:5432"
    volumes:
      - kcp_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcp -d kcp"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    container_name: kcp_pipeline
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KCP_DATABASE_URL: postgresql+psycopg2://kcp:kcp@postgres:5432/kcp
      KCP_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "knbs_cbk_pipeline.ingestion.runner"]

  redis:
    image: redis:7
    container_name: kcp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  kcp_pgdata:
