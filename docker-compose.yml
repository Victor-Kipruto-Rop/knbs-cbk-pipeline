services:
  postgres:
    image: postgres:16
    container_name: kcp_postgres
    environment:
      POSTGRES_USER: ${KCP_DB_USER:-kcp}
      POSTGRES_PASSWORD: ${KCP_DB_PASSWORD:-kcp}
      POSTGRES_DB: ${KCP_DB_NAME:-kcp}
    ports:
      - "${KCP_HOST_DB_PORT:-5433}:5432"
    volumes:
      - kcp_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KCP_DB_USER:-kcp} -d ${KCP_DB_NAME:-kcp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-bootstrap:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${KCP_DB_PASSWORD:-kcp}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "psql -h postgres -U ${KCP_DB_USER:-kcp} -d ${KCP_DB_NAME:-kcp} -v ON_ERROR_STOP=1 -c \"CREATE SCHEMA IF NOT EXISTS staging; CREATE SCHEMA IF NOT EXISTS marts; ALTER ROLE ${KCP_DB_USER:-kcp} SET search_path TO staging,marts,public;\""
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: kcp_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${KCP_HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - kcp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pipeline:
    profiles: ["pipeline"]
    build: .
    container_name: kcp_pipeline
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      KCP_DATABASE_URL: postgresql+psycopg2://${KCP_DB_USER:-kcp}:${KCP_DB_PASSWORD:-kcp}@postgres:5432/${KCP_DB_NAME:-kcp}
      KCP_REDIS_URL: redis://redis:6379/0
      KCP_DB_HOST: postgres
      KCP_DB_PORT: 5432
      KCP_DB_USER: ${KCP_DB_USER:-kcp}
      KCP_DB_PASSWORD: ${KCP_DB_PASSWORD:-kcp}
      KCP_DB_NAME: ${KCP_DB_NAME:-kcp}
      KCP_SOURCES_CONFIG_PATH: /app/config/sources.yaml
      KCP_RAW_DATA_DIR: /app/data/raw
      KCP_STAGING_DATA_DIR: /app/data/staging
      KCP_CURATED_DATA_DIR: /app/data/curated
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "knbs_cbk_pipeline.pipeline"]
    restart: "no"

  api:
    profiles: ["api"]
    build: .
    container_name: kcp_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      KCP_DATABASE_URL: postgresql+psycopg2://${KCP_DB_USER:-kcp}:${KCP_DB_PASSWORD:-kcp}@postgres:5432/${KCP_DB_NAME:-kcp}
      KCP_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: ["uvicorn", "knbs_cbk_pipeline.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-db-init:
    profiles: ["orchestration"]
    image: postgres:16
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${KCP_DB_PASSWORD:-kcp}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "psql -h postgres -U ${KCP_DB_USER:-kcp} -d ${KCP_DB_NAME:-kcp} -tAc \"SELECT 1 FROM pg_database WHERE datname='airflow'\" | grep -q 1 || createdb -h postgres -U ${KCP_DB_USER:-kcp} -O ${KCP_DB_USER:-kcp} airflow"

  airflow:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: kcp_airflow
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${KCP_DB_USER:-kcp}:${KCP_DB_PASSWORD:-kcp}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      KCP_DATABASE_URL: postgresql+psycopg2://${KCP_DB_USER:-kcp}:${KCP_DB_PASSWORD:-kcp}@postgres:5432/${KCP_DB_NAME:-kcp}
      KCP_REDIS_URL: redis://redis:6379/0
      KCP_DB_HOST: postgres
      KCP_DB_PORT: 5432
      KCP_DB_USER: ${KCP_DB_USER:-kcp}
      KCP_DB_PASSWORD: ${KCP_DB_PASSWORD:-kcp}
      KCP_DB_NAME: ${KCP_DB_NAME:-kcp}
      KCP_SOURCES_CONFIG_PATH: /opt/airflow/project/config/sources.yaml
      KCP_RAW_DATA_DIR: /opt/airflow/data/raw
      KCP_STAGING_DATA_DIR: /opt/airflow/data/staging
      KCP_CURATED_DATA_DIR: /opt/airflow/data/curated
    ports:
      - "8080:8080"
    volumes:
      - ./src/knbs_cbk_pipeline/orchestration/dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data
    command: ["airflow", "standalone"]
    restart: unless-stopped

volumes:
  kcp_pgdata:
  kcp_redisdata:
