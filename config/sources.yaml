# Official source landing pages. KNBS pages are resolved to real files by KNBSExtractor.
sources:
  - id: cbk_fx_rates
    owner: cbk
    description: Daily indicative USD/KES and other CBK provider exchange rates via Frankfurter.
    extractor: cbk_extractor
    fetch_mode: api_json
    endpoint: "https://api.frankfurter.dev/v2/latest"
    params: {providers: CBK, base: USD}
    schedule: "0 6 * * *"
    format: json
    schema_version: 1
    freshness_sla_hours: 30

  - id: cbk_key_rates
    owner: cbk
    description: Key monetary and lending rates displayed by the Central Bank of Kenya.
    extractor: cbk_extractor
    fetch_mode: html_scrape
    endpoint: "https://www.centralbank.go.ke/"
    schedule: "0 6 * * *"
    format: html
    schema_version: 1
    freshness_sla_hours: 48

  - id: knbs_cpi
    owner: knbs
    description: Monthly Consumer Price Index and annual inflation workbook.
    extractor: knbs_extractor
    fetch_mode: file_download
    endpoint: "https://www.knbs.or.ke/download/consumer-price-index-cpi/"
    download_link_keywords: ["consumer price index", "cpi", "inflation"]
    schedule: "0 7 15 * *"
    format: xlsx
    schema_version: 1
    freshness_sla_hours: 720

  - id: knbs_gdp_quarterly
    owner: knbs
    description: Quarterly GDP release. Parser requires recognizable quarter and GDP value columns.
    extractor: knbs_extractor
    fetch_mode: file_download
    endpoint: "https://www.knbs.or.ke/download/quarterly-gross-domestic-product-report/"
    download_link_keywords: ["quarterly gross domestic product", "quarterly gdp", "gdp report"]
    schedule: "0 7 1 1,4,7,10 *"
    format: xlsx
    schema_version: 1
    freshness_sla_hours: 2160
