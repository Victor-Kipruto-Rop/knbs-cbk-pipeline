[project]
name = "knbs-cbk-pipeline"
version = "0.2.0"
description = "Open data pipeline for KNBS and CBK economic indicators"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1", "pandas>=2.2,<3", "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3", "sqlalchemy>=2.0,<3", "psycopg2-binary>=2.9",
    "pyyaml>=6.0", "tenacity>=8.2", "structlog>=24.1",
    "beautifulsoup4>=4.12", "lxml>=5.2", "openpyxl>=3.1", "redis>=5.0,<7",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "respx>=0.21", "ruff>=0.4"]
orchestration = ["apache-airflow>=2.9,<3"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
analytics = ["dbt-core>=1.8,<2", "dbt-postgres>=1.8,<2"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
