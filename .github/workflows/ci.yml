name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kcp
          POSTGRES_PASSWORD: kcp
          POSTGRES_DB: kcp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kcp -d kcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KCP_DATABASE_URL: postgresql+psycopg2://kcp:kcp@localhost:5432/kcp
      KCP_REDIS_URL: redis://localhost:6379/0
      KCP_DB_HOST: localhost
      KCP_DB_PORT: 5432
      KCP_DB_USER: kcp
      KCP_DB_PASSWORD: kcp
      KCP_DB_NAME: kcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analytics,api]"
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Initialize PostgreSQL schemas and search path
        run: |
          PGPASSWORD=kcp psql -h localhost -p 5432 -U kcp -d kcp -c "CREATE SCHEMA IF NOT EXISTS staging; CREATE SCHEMA IF NOT EXISTS marts; ALTER ROLE kcp SET search_path TO staging,marts,public;"
          python -c "from knbs_cbk_pipeline.warehouse.loaders.postgres_loader import ensure_schema, get_engine; ensure_schema(get_engine())"
      - name: Verify PostgreSQL connectivity
        run: python -c "from sqlalchemy import create_engine,text; e=create_engine('$KCP_DATABASE_URL'); e.connect().execute(text('select 1')); print('PostgreSQL OK')"
      - name: dbt dependency resolution and build
        working-directory: dbt
        run: |
          dbt deps
          dbt build --profiles-dir .
